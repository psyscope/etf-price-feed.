name: Daily ETF closes

on:
  schedule:
    # 22:30 UTC Mon-Fri, after the US close (also catches late data)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - run: python scripts/fetch_closes.py
      - name: Commit updated prices
        run: |
          git config user.name "price-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet || git commit -m "Daily closes $(date -u +%F)"
          git push
